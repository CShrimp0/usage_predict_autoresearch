experiment:
  name: baseline_ridge

seed: 42

paths:
  outputs_root: /home/szdx/LNX/usage_predict_feature_engineering/outputs
  feature_table: null
  include_model_in_run_name: true

data:
  metadata_path: /path/to/metadata.csv
  metadata_format: auto
  sheet_name: null
  image_root: null
  mask_root: null
  age_filter:
    enabled: true
    min_age: 18
    max_age: 100
  drop_rows_missing_target: true
  deduplicate_on: sample_id
  strict_subject_consistency: true
  feature_mode: image_only
  columns:
    sample_id: sample_id
    subject_id: subject_id
    age: age
    image_path: image_path
    image_filename: null
    mask_path: mask_path
    roi_path: null
    split: split
    extra:
      sex: sex
      bmi: bmi
  model_metadata_columns:
    numeric:
      - bmi
    categorical:
      - sex
    boolean: []

image:
  preprocessing:
    resize:
      - 256
      - 256
    clip_percentiles:
      - 1
      - 99
    normalize: minmax

feature_extraction:
  scopes:
    - whole_image
  enabled_groups:
    - intensity
    - sharpness
    - texture
  intensity:
    bins: 64
    percentiles:
      - 5
      - 25
      - 50
      - 75
      - 95
  sharpness: {}
  texture:
    quantization_levels: 16
    glcm_distances:
      - 1
      - 2
    glcm_angles:
      - 0.0
      - 0.785398
      - 1.570796
      - 2.356194
    lbp_radius: 1
    lbp_points: 8
    include_hog: false
    include_glrlm: true
    include_glszm: true
    include_ngtdm: false
    hog_bins: 9
    hog_pixels_per_cell:
      - 16
      - 16
    hog_cells_per_block:
      - 2
      - 2
  morphology: {}
  radiomics:
    mode: global_handcrafted
    settings: {}
    feature_classes:
      - firstorder
      - shape2D
      - glcm
      - glrlm
      - glszm
      - ngtdm
    intensity:
      bins: 64
      percentiles:
        - 5
        - 25
        - 50
        - 75
        - 95
    texture:
      quantization_levels: 16
      glcm_distances:
        - 1
        - 2
      glcm_angles:
        - 0.0
        - 0.785398
        - 1.570796
        - 2.356194
      lbp_radius: 1
      lbp_points: 8
      include_hog: false
      include_glrlm: true
      include_glszm: true
      include_ngtdm: true

split:
  strategy: holdout
  stratify_by_age: true
  age_bin_method: quantile
  age_bins: 5
  age_bin_edges: null
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  n_splits: 5
  shuffle: true
  random_state: 42

preprocessing:
  numeric_imputer: median
  categorical_imputer: most_frequent
  scaler: standard
  low_variance:
    enabled: true
    threshold: 0.0
  correlation_filter:
    enabled: true
    threshold: 0.95
  pca:
    enabled: false
    n_components: 0.95

selection:
  enabled: false
  method: univariate_k_best
  params:
    k: 50
    score_func: mutual_info

model:
  name: ridge
  params:
    alpha: 1.0

search:
  enabled: true
  method: grid
  scoring: neg_mean_absolute_error
  refit: neg_mean_absolute_error
  cv_n_splits: 5
  n_jobs: -1
  verbose: 0
  param_grid:
    ridge:
      model__alpha:
        - 0.01
        - 0.1
        - 1.0
        - 10.0
        - 100.0
    elasticnet:
      model__alpha:
        - 0.0005
        - 0.001
        - 0.01
        - 0.1
      model__l1_ratio:
        - 0.1
        - 0.3
        - 0.5
        - 0.7
        - 0.9
      model__max_iter:
        - 5000
    random_forest:
      model__n_estimators:
        - 200
        - 500
      model__max_depth:
        - null
        - 8
        - 16
      model__min_samples_leaf:
        - 1
        - 3
        - 5

evaluation:
  age_bin_count: 5
  age_bin_edges: null
  subgroup_columns:
    - sex

explain:
  permutation_importance:
    enabled: true
    n_repeats: 20
    n_jobs: -1
  shap:
    enabled: false
    top_k: 20

reporting:
  save_feature_table: true
